name: Concert Grand III midpoint CQ coupling
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/midpoint_cq.py','research/stage-concert-grand-iii/test_midpoint_cq.py','.github/workflows/concert-grand-iii-midpoint-cq.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3 numba==0.61.2
      - run: python research/stage-concert-grand-iii/test_midpoint_cq.py
      - run: python research/stage-concert-grand-iii/midpoint_cq.py --out /tmp/g3-midpoint-cq
      - uses: actions/upload-artifact@v4
        with:
          name: G3-midpoint-cq
          path: /tmp/g3-midpoint-cq/
