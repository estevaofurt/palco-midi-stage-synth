name: Concert Grand F10f D4 headroom and sustain sensitivity
on:
  push:
    branches: [research/stage-concert-grand]
    paths:
      - '.github/workflows/concert-grand-f10f-d4.yml'
      - 'research/stage-concert-grand/f10f-d4-*.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f10e-d4-extension.test.mjs
      - run: node research/stage-concert-grand/f10f-d4-sustain.test.mjs
  headroom:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        midi: [53, 55, 57, 60, 64, 67, 72]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f10f-d4-headroom-demo.mjs /tmp/f10f-headroom ${{ matrix.midi }} 127
      - uses: actions/upload-artifact@v4
        with:
          name: F10F-D4-headroom-midi${{ matrix.midi }}-touch127
          path: /tmp/f10f-headroom/
          if-no-files-found: error
  sustain:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - {midi: 60, touch: 24}
          - {midi: 60, touch: 76}
          - {midi: 60, touch: 127}
          - {midi: 67, touch: 76}
          - {midi: 67, touch: 127}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f10f-d4-sustain-demo.mjs /tmp/f10f-sustain ${{ matrix.midi }} ${{ matrix.touch }}
      - uses: actions/upload-artifact@v4
        with:
          name: F10F-D4-loss50-midi${{ matrix.midi }}-touch${{ matrix.touch }}
          path: /tmp/f10f-sustain/
          if-no-files-found: error
