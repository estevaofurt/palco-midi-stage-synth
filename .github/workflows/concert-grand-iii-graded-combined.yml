name: Concert Grand III combined graded upper refinement
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/graded_combined_refinement.py','.github/workflows/concert-grand-iii-graded-combined.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        angle: ['30','55']
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: '2'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          for r in 45717196561 45723509912 45725159589 45722209678; do
            test "$(gh run view "$r" --json conclusion --jq .conclusion)" = success
          done
          gh run download 45717196561 -n G3-high-modal-${{ matrix.angle }} -D /tmp/g3-high
          gh run download 45723509912 -n G3-consolidated-exterior-${{ matrix.angle }} -D /tmp/g3-ext
          gh run download 45725159589 -n G3-graded-cavity-${{ matrix.angle }} -D /tmp/g3-graded
          gh run download 45722209678 -n G3-graded-edge-trace-${{ matrix.angle }} -D /tmp/g3-trace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/test_graded_volume_mesh.py
      - run: python research/stage-concert-grand-iii/test_graded_cavity_replay.py
      - run: python research/stage-concert-grand-iii/graded_combined_refinement.py --scale /tmp/g3-scale/scale_geometry.json --archive /tmp/g3-high --consolidated /tmp/g3-ext --graded /tmp/g3-graded --trace /tmp/g3-trace/graded_edge_trace.json --angle ${{ matrix.angle }} --out /tmp/g3-combined
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-graded-combined-${{ matrix.angle }}
          path: /tmp/g3-combined/
          if-no-files-found: warn
