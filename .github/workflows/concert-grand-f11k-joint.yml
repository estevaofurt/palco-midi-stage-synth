name: Concert Grand F11k bass joint stiffness pitch sensitivity
on:
  push:
    branches: [research/stage-concert-grand]
    paths:
      - '.github/workflows/concert-grand-f11k-patch.yml'
      - 'research/stage-concert-grand/f11k-bass-joint-trial*.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f11k-bass-joint-trial.test.mjs
  trials:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        midi: [43,48]
        variant: [J25,J400]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f11k-bass-joint-trial-demo.mjs /tmp/f11k ${{ matrix.midi }} 127 ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: F11K-bass-midi${{ matrix.midi }}-variant${{ matrix.variant }}-touch127
          path: /tmp/f11k/
          if-no-files-found: error
