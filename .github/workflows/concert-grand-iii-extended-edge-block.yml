name: Concert Grand III extended edge block pilot
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/disjoint_extended_edge_block.py','research/stage-concert-grand-iii/test_disjoint_extended_edge_block.py','.github/workflows/concert-grand-iii-extended-edge-block.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        angle: ['30','55']
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - run: |
          for r in 45717196561 45723509912 45722209678; do
            test "$(gh run view "$r" --json conclusion --jq .conclusion)" = success
          done
          gh run download 45717196561 -n G3-high-modal-${{ matrix.angle }} -D /tmp/g3-high
          gh run download 45723509912 -n G3-consolidated-exterior-${{ matrix.angle }} -D /tmp/g3-ext
          gh run download 45722209678 -n G3-graded-edge-trace-${{ matrix.angle }} -D /tmp/g3-trace
          gh run download 45725732251 -n G3-enriched-reactive-${{ matrix.angle }}-disjoint -D /tmp/g3-prev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/test_disjoint_extended_edge_block.py
      - run: python research/stage-concert-grand-iii/disjoint_extended_edge_block.py --scale /tmp/g3-scale/scale_geometry.json --archive /tmp/g3-high --consolidated /tmp/g3-ext --trace /tmp/g3-trace/graded_edge_trace.json --previous /tmp/g3-prev --angle ${{ matrix.angle }} --out /tmp/g3-refine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-extended-edge-block-${{ matrix.angle }}
          path: /tmp/g3-refine/
          if-no-files-found: warn
