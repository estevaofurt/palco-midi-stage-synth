name: Concert Grand III vector unison and axial proof
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/vector_unison*.py','research/stage-concert-grand-iii/axial_*.py','research/stage-concert-grand-iii/test_vector_axial.py','.github/workflows/concert-grand-iii-vector-axial.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        key: [49,60,84]
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/test_vector_axial.py
      - if: matrix.key != 49
        run: python research/stage-concert-grand-iii/axial_diagnostic.py --scale /tmp/g3-scale/scale_geometry.json --key ${{ matrix.key }} --out /tmp/g3-axial
      - if: always() && matrix.key != 49
        uses: actions/upload-artifact@v4
        with:
          name: G3-axial-${{ matrix.key }}
          path: /tmp/g3-axial/
          if-no-files-found: warn
      - if: always()
        run: python research/stage-concert-grand-iii/vector_unison_diagnostic.py --scale /tmp/g3-scale/scale_geometry.json --key ${{ matrix.key }} --out /tmp/g3-vector
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-vector-unison-${{ matrix.key }}
          path: /tmp/g3-vector/
          if-no-files-found: warn
