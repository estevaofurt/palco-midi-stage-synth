name: Concert Grand III frozen basis independent frequencies
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/new_frequency_validation.py','research/stage-concert-grand-iii/test_new_frequency_validation.py','.github/workflows/concert-grand-iii-new-frequency.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - run: python research/stage-concert-grand-iii/test_new_frequency_validation.py
  proof:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        angle: ['30','55']
    runs-on: ubuntu-latest
    timeout-minutes: 140
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: |
          for r in 45726103993 45729177312; do
            test "$(gh run view "$r" --json conclusion --jq .conclusion)" = success
          done
          gh run download 45726103993 -n G3-graded-combined-${{ matrix.angle }} -D /tmp/g3-fine
          gh run download 45729177312 -n G3-fixed-snapshot-${{ matrix.angle }} -D /tmp/g3-basis
      - run: python research/stage-concert-grand-iii/new_frequency_validation.py --scale /tmp/g3-scale/scale_geometry.json --fine /tmp/g3-fine --basis /tmp/g3-basis --angle ${{ matrix.angle }} --out /tmp/g3-new
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-new-frequency-${{ matrix.angle }}
          path: /tmp/g3-new/
          if-no-files-found: warn
