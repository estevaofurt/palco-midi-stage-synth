name: Concert Grand II G2.06a hammer contact
on:
  push:
    branches: [research/stage-concert-grand-ii]
    paths: ['research/stage-concert-grand-ii/g2_hammer_pilot*.mjs','.github/workflows/concert-grand-ii-hammer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand-ii/g2_hammer_pilot.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G2-hammer-contact-numeric
          path: /tmp/g2-hammer/report.json
          if-no-files-found: error
