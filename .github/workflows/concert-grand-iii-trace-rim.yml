name: Concert Grand III constrained trace and mobile rim
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/trace_plate.py','research/stage-concert-grand-iii/rim_structure*.py','research/stage-concert-grand-iii/rim_structure_hypothesis.json','research/stage-concert-grand-iii/trace_rim_diagnostic.py','research/stage-concert-grand-iii/test_trace_rim.py','.github/workflows/concert-grand-iii-trace-rim.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        case: [trace,rim]
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/test_trace_rim.py
      - run: python research/stage-concert-grand-iii/trace_rim_diagnostic.py --scale /tmp/g3-scale/scale_geometry.json --case ${{ matrix.case }} --out /tmp/g3-trace-rim
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-trace-rim-${{ matrix.case }}
          path: /tmp/g3-trace-rim/
          if-no-files-found: warn
