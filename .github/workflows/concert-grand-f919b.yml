name: Concert Grand F9.19b selective structural damping
on:
  push:
    branches: [research/stage-concert-grand]
    paths:
      - '.github/workflows/concert-grand-f919b.yml'
      - 'research/stage-concert-grand/f9-rattle-selective*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f9-rattle-selective.test.mjs
  render:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        midi: [24, 76, 127]
        multiplier: [4, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f9-rattle-selective-demo.mjs /tmp/f919b ${{ matrix.midi }} ${{ matrix.multiplier }}
      - uses: actions/upload-artifact@v4
        with:
          name: F919B-midi${{ matrix.midi }}-selectiveLoss${{ matrix.multiplier }}
          path: /tmp/f919b/
          if-no-files-found: error
