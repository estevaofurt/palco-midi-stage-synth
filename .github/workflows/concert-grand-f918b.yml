name: Concert Grand F9.18b exhaustive MIDI physical sweep
on:
  push:
    branches: [research/stage-concert-grand]
    paths:
      - '.github/workflows/concert-grand-f918b.yml'
      - 'research/stage-concert-grand/f9-midi-sweep-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f9-midi-sweep-analysis.test.mjs
  sweep:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f9-midi-sweep-demo.mjs ${{ matrix.shard }} /tmp/shard.json
      - uses: actions/upload-artifact@v4
        with:
          name: F918B-shard${{ matrix.shard }}
          path: /tmp/shard.json
          if-no-files-found: error
  aggregate:
    needs: sweep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: F918B-shard*
          path: /tmp/inputs
      - run: node research/stage-concert-grand/f9-midi-sweep-aggregate.mjs /tmp/inputs /tmp/velocity-sweep.json
      - uses: actions/upload-artifact@v4
        with:
          name: F918B-velocity-sweep-numeric
          path: /tmp/velocity-sweep.json
          if-no-files-found: error
