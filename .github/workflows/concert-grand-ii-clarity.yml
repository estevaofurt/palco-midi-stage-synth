name: Concert Grand II G2.11e physical clarity sensitivity
on:
  push:
    branches: [research/stage-concert-grand-ii]
    paths: ['research/stage-concert-grand-ii/g2_clarity_screen.py','.github/workflows/concert-grand-ii-clarity.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        case: ['60','66','67','72','triad']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3 soundfile==0.13.1
      - run: node research/stage-concert-grand-ii/g2_shared_board_export.mjs
      - run: node research/stage-concert-grand-ii/g2_octave_export.mjs
      - uses: actions/download-artifact@v4
        with:
          name: G2-11-audit-${{ matrix.case }}
          run-id: 45612682505
          github-token: ${{ github.token }}
          path: /tmp/baseline/G2-11-audit-${{ matrix.case }}
      - run: python research/stage-concert-grand-ii/g2_clarity_screen.py --case ${{ matrix.case }} --baseline /tmp/baseline --out /tmp/g2-clarity
      - uses: actions/upload-artifact@v4
        with:
          name: G2-11e-clarity-${{ matrix.case }}
          path: /tmp/g2-clarity/
          if-no-files-found: error
