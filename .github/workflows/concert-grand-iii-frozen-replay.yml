name: Concert Grand III frozen basis replay and harmonic benchmark
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/frozen_basis_replay.py','research/stage-concert-grand-iii/test_frozen_basis_replay.py','.github/workflows/concert-grand-iii-frozen-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - run: python research/stage-concert-grand-iii/test_frozen_basis_replay.py
  proof:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        angle: ['30','55']
        mode: ['fine','new']
    runs-on: ubuntu-latest
    timeout-minutes: 155
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: |
          gh run download 45729376812 -n G3-common-snapshot-transfer-${{ matrix.angle }} -D /tmp/g3-120
          gh run download 45729177312 -n G3-fixed-snapshot-${{ matrix.angle }} -D /tmp/g3-168
          if [ "${{ matrix.mode }}" = fine ]; then
            gh run download 45717196561 -n G3-high-modal-${{ matrix.angle }} -D /tmp/g3-high
            gh run download 45723509912 -n G3-consolidated-exterior-${{ matrix.angle }} -D /tmp/g3-ext
            gh run download 45726103993 -n G3-graded-combined-${{ matrix.angle }} -D /tmp/g3-fine
            python research/stage-concert-grand-iii/frozen_basis_replay.py --scale /tmp/g3-scale/scale_geometry.json --basis120 /tmp/g3-120 --basis168 /tmp/g3-168 --archive /tmp/g3-high --consolidated /tmp/g3-ext --fine /tmp/g3-fine --angle ${{ matrix.angle }} --out /tmp/g3-result
          else
            for attempt in $(seq 1 140); do
              status=$(gh run view 45729588927 --json jobs --jq '.jobs[] | select(.name=="proof (${{ matrix.angle }})") | .status')
              if [ "$status" = completed ]; then break; fi
              sleep 60
            done
            test "$status" = completed
            gh run download 45729588927 -n G3-new-frequency-${{ matrix.angle }} -D /tmp/g3-new
            python research/stage-concert-grand-iii/frozen_basis_replay.py --scale /tmp/g3-scale/scale_geometry.json --basis120 /tmp/g3-120 --basis168 /tmp/g3-168 --new /tmp/g3-new --angle ${{ matrix.angle }} --out /tmp/g3-result
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-frozen-replay-${{ matrix.angle }}-${{ matrix.mode }}
          path: /tmp/g3-result/
          if-no-files-found: warn
