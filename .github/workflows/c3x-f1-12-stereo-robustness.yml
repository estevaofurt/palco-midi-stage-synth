name: STAGE SYNTH F1.12 - C5 C4 stereo and window robustness audit
on:
  push:
    branches:
      - research/import-c3x-v10-20261123
    paths:
      - '.github/workflows/c3x-f1-12-stereo-robustness.yml'
      - 'research/c3x-physical/c5_stereo_robustness.py'
      - 'research/c3x-physical/test_c5_stereo_robustness.py'
      - 'research/c3x-physical/C5_C4_verified_numeric_report.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  licensed-c5-stereo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      C5_AUDIO_TEMP: /tmp/stage-synth-f1-12-c5-originals
      C5_NUMERIC_TEMP: /tmp/stage-synth-f1-12-metrics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'soundfile>=0.12,<1'
      - name: Eleven synthetic robustness and guard tests
        run: python -m unittest discover -s research/c3x-physical -p 'test_c5_stereo_robustness.py' -v
      - name: Acquire exactly 3 verified Yamaha C5 originals, then analyze stereo and temporal sensitivity
        run: |
          mkdir -p "$C5_AUDIO_TEMP" "$C5_NUMERIC_TEMP"
          python - <<'PY'
          import sys, os
          from pathlib import Path
          sys.path.insert(0,'research/c3x-physical')
          from download_analyze_c5 import download_sources
          from c5_stereo_robustness import analyze_files
          base=Path(os.environ['C5_AUDIO_TEMP'])
          download_sources(base) # verifies exact pinned SHA-256 and bytes, or fails closed
          analyze_files(base,Path('research/c3x-physical/C5_C4_verified_numeric_report.json'),
                Path(os.environ['C5_NUMERIC_TEMP'])/'f1-12-c5-stereo-numeric-only.json')
          PY
      - name: Upload ONLY numeric methods and provenance — no source FLACs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: F1-12-C5-C4-stereo-window-numeric-only
          path: /tmp/stage-synth-f1-12-metrics/f1-12-c5-stereo-numeric-only.json
          retention-days: 21
          if-no-files-found: error
      - name: Delete external licensed audio and temporary results
        if: always()
        run: rm -rf "$C5_AUDIO_TEMP" "$C5_NUMERIC_TEMP"
