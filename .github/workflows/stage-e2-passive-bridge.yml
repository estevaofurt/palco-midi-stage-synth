name: Stage E2 passive bridge 88-key validation
on:
  pull_request:
    branches:
      - main
    paths:
      - 'research/damper-aware-shared-bridge.mjs'
      - 'research/hammer-driven-passive-piano.mjs'
      - 'research/measured-radiation-adapter.mjs'
      - 'research/shared-passive-modal-piano.mjs'
      - 'research/bridge-mobility-h1.mjs'
      - 'research/passive-bridge-mobility-fit.mjs'
      - 'research/pure-physical-audition-e28.mjs'
      - 'research/analytic-soundboard-radiation.mjs'
      - 'research/pure-physical-radiation-e29.mjs'
      - 'research/compare-analytic-mesh-e30.mjs'
      - 'research/diagnose-piano-source-e31.mjs'
      - 'research/nonlinear-felt-contact-e31.mjs'
      - 'research/reactive-felt-modal-piano-e32.mjs'
      - 'research/coupled-nonlinear-hammers-e32.mjs'
      - 'tests/damper_aware_shared_bridge.test.mjs'
      - 'tests/hammer_driven_passive_piano.test.mjs'
      - 'tests/measured_radiation_adapter.test.mjs'
      - 'tests/shared_passive_modal_piano.test.mjs'
      - 'tests/bridge_mobility_h1.test.mjs'
      - 'tests/passive_bridge_mobility_fit.test.mjs'
      - 'tests/pure_physical_audition_e28.test.mjs'
      - 'tests/analytic_soundboard_radiation_e29.test.mjs'
      - 'tests/compare_analytic_mesh_e30.test.mjs'
      - 'tests/diagnose_piano_source_e31.test.mjs'
      - 'tests/nonlinear_felt_contact_e31.test.mjs'
      - 'tests/reactive_felt_modal_piano_e32.test.mjs'
      - 'tests/coupled_nonlinear_hammers_e32.test.mjs'
      - 'scripts/benchmark_nonlinear_hammers_e32.mjs'
      - 'scripts/diagnose_nonlinear_hammers_e32.mjs'
      - 'scripts/benchmark_damper_aware_shared_bridge.mjs'
      - 'scripts/benchmark_hammer_driven_passive_piano.mjs'
      - 'scripts/benchmark_shared_passive_modal_piano.mjs'
      - 'scripts/compare_passive_modal_profiles.mjs'
      - 'scripts/render_pure_physical_e28.mjs'
      - 'scripts/render_pure_physical_e29.mjs'
      - 'scripts/benchmark_analytic_physical_e29.mjs'
      - 'scripts/render_physical_mesh_e30.mjs'
      - 'scripts/benchmark_analytic_mesh_e30.mjs'
      - 'scripts/audit_piano_source_e31.mjs'
      - '.github/workflows/stage-e2-passive-bridge.yml'
  workflow_dispatch:
jobs:
  bridge-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage suite + passive full 88-key bridge regressions
        run: npm run check
      - name: Node benchmark 88 physical keys 32/48/64 struck
        run: node scripts/benchmark_damper_aware_shared_bridge.mjs | tee bridge-benchmark.json
      - name: Node benchmark E2.1 with actual hammer force schedules
        run: node scripts/benchmark_hammer_driven_passive_piano.mjs | tee hammer-benchmark.json
      - name: Node benchmark E2.3 shared multi-partial bank
        run: node scripts/benchmark_shared_passive_modal_piano.mjs | tee modal-benchmark.json
      - name: Compare sparse/full modal bank CPU and mechanical proxy
        run: node scripts/compare_passive_modal_profiles.mjs | tee modal-tradeoff.json
      - name: Render sample-free E2.8 mechanical audition WAV
        run: node scripts/render_pure_physical_e28.mjs e28-physical-only-mechanical-proxy.wav | tee e28-physical-audition.json
      - name: Render sample-free E2.9 analytic air radiation WAV
        run: node scripts/render_pure_physical_e29.mjs e29-physical-piano-analytic-air.wav | tee e29-air-radiation.json
      - name: Benchmark 32/48/64 fully coupled notes plus analytic radiation
        run: node scripts/benchmark_analytic_physical_e29.mjs | tee e29-physical-benchmark.json
      - name: Compare physical E3.0 48 96 192 mesh WAVs and relative error
        run: node scripts/render_physical_mesh_e30.mjs | tee e30-render-summary.json
      - name: Benchmark physical E3.0 32 48 64 notes with 48 96 192 patches
        run: node scripts/benchmark_analytic_mesh_e30.mjs | tee e30-mesh-benchmark.json
      - name: Diagnose E3.0 physical source mismatch and harmonic deficit
        run: node scripts/audit_piano_source_e31.mjs | tee e31-report.json
      - name: E3.2 energy-aware hammer attack, CPU cost for 1-64 contacts
        run: node scripts/benchmark_nonlinear_hammers_e32.mjs | tee e32-hammer-benchmark.json
      - name: E3.2 C2 C3 C4 C5 harmonic diagnosis without any recordings
        run: node scripts/diagnose_nonlinear_hammers_e32.mjs | tee e32-hammer-audit.json
      - name: Ensure public audio and user interface are unchanged
        run: |
          git diff --exit-code origin/main...HEAD -- physical-piano-hybrid.js physical-piano.js physical-piano-legacy.js acoustic.js app.js stage.js panel.js patches.js fx-rack.js performance.js index.html package.json
      - name: Preserve numeric benchmark only
        uses: actions/upload-artifact@v4
        with:
          name: stage-e2-88-key-node-benchmark
          path: |
            bridge-benchmark.json
            hammer-benchmark.json
            modal-benchmark.json
            modal-tradeoff.json
            e28-physical-audition.json
            e28-physical-only-mechanical-proxy.wav
            e29-air-radiation.json
            e29-physical-benchmark.json
            e29-physical-piano-analytic-air.wav
            e30-render-summary.json
            e30-mesh-comparison.json
            e30-mesh-benchmark.json
            e31-report.json
            e31-physical-source-diagnostic.json
            e32-hammer-benchmark.json
            e32-hammer-audit.json
            e32-hammer-harmonic-audit.json
            e30-physical-48-patches.wav
            e30-physical-96-patches.wav
            e30-physical-192-patches.wav
          retention-days: 30
