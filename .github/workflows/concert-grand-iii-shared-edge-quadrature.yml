name: Concert Grand III shared edge singular quadrature
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/exterior_shared_edge.py','research/stage-concert-grand-iii/test_exterior_shared_edge.py','research/stage-concert-grand-iii/shared_edge_quadrature_diagnostic.py','.github/workflows/concert-grand-iii-shared-edge-quadrature.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        angle: ['30','55']
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '2'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: test "$(gh api repos/$GITHUB_REPOSITORY/actions/jobs/139567997308 --jq .conclusion)" = success
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/test_exterior_shared_edge.py
      - run: python research/stage-concert-grand-iii/shared_edge_quadrature_diagnostic.py --scale /tmp/g3-scale/scale_geometry.json --angle ${{ matrix.angle }} --out /tmp/g3-shared-edge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-shared-edge-${{ matrix.angle }}
          path: /tmp/g3-shared-edge/
          if-no-files-found: warn
