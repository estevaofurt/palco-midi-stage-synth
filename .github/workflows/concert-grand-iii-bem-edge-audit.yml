name: Concert Grand III independent edge graded audit
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/bem_edge_audit*.py','research/stage-concert-grand-iii/test_bem_edge_audit.py','.github/workflows/concert-grand-iii-bem-edge-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        angle: ['30','55']
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/test_bem_power_partition.py
      - run: python research/stage-concert-grand-iii/test_bem_edge_audit.py
      - run: python research/stage-concert-grand-iii/bem_edge_audit_diagnostic.py --scale /tmp/g3-scale/scale_geometry.json --angle ${{ matrix.angle }} --out /tmp/g3-edge-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-edge-audit-${{ matrix.angle }}
          path: /tmp/g3-edge-audit/
          if-no-files-found: warn
