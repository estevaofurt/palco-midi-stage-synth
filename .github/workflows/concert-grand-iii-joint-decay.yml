name: Concert Grand III joint unison and structural decay
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/physical_joint_decay.py','research/stage-concert-grand-iii/test_physical_joint_decay.py','.github/workflows/concert-grand-iii-joint-decay.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3 numba==0.61.2
      - run: python research/stage-concert-grand-iii/test_physical_joint_decay.py
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - uses: actions/download-artifact@v4
        with:
          name: G3-wire-port-enrichment
          run-id: 45742331448
          github-token: ${{ github.token }}
          path: /tmp/g3-wire
      - uses: actions/download-artifact@v4
        with:
          name: G3-physical-unison-decay
          run-id: 45773754395
          github-token: ${{ github.token }}
          path: /tmp/g3-unison
      - uses: actions/download-artifact@v4
        with:
          name: G3-structural-region-decay
          run-id: 45773996558
          github-token: ${{ github.token }}
          path: /tmp/g3-region
      - run: python research/stage-concert-grand-iii/physical_joint_decay.py --scale /tmp/g3-scale/scale_geometry.json --source /tmp/g3-wire --unison /tmp/g3-unison --regions /tmp/g3-region --out /tmp/g3-joint
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-physical-joint-decay
          path: /tmp/g3-joint/
          if-no-files-found: warn
