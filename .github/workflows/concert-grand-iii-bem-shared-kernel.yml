name: Concert Grand III shared P1 kernel regression
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/bem_linear.py','research/stage-concert-grand-iii/bem_p1_stream.py','research/stage-concert-grand-iii/bem_oversampled.py','research/stage-concert-grand-iii/bem_weak_p1.py','research/stage-concert-grand-iii/test_bem_p1_shared_kernel.py','.github/workflows/concert-grand-iii-bem-shared-kernel.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - run: python research/stage-concert-grand-iii/test_bem_linear.py
      - run: python research/stage-concert-grand-iii/test_bem_oversampled.py
      - run: python research/stage-concert-grand-iii/test_bem_weak_p1.py
      - run: python research/stage-concert-grand-iii/test_bem_weak_p1_refined.py
      - run: python research/stage-concert-grand-iii/test_bem_p1_stream.py
      - run: python research/stage-concert-grand-iii/test_bem_p1_shared_kernel.py
