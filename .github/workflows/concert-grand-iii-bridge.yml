name: Concert Grand III continuous bridge beam
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/continuous_bridge*.py','research/stage-concert-grand-iii/bridge_hypothesis.json','research/stage-concert-grand-iii/test_continuous_bridge.py','.github/workflows/concert-grand-iii-bridge.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        section: [bass,treble]
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/test_continuous_bridge.py
      - run: python research/stage-concert-grand-iii/continuous_bridge_diagnostic.py --scale /tmp/g3-scale/scale_geometry.json --section ${{ matrix.section }} --out /tmp/g3-bridge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-bridge-${{ matrix.section }}
          path: /tmp/g3-bridge/
          if-no-files-found: warn
