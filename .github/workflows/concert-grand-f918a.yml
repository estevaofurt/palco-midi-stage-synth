name: Concert Grand F9.18a MIDI listening progression
on:
  push:
    branches: [research/stage-concert-grand]
    paths:
      - '.github/workflows/concert-grand-f918a.yml'
      - 'research/stage-concert-grand/f9-midi-listening-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node research/stage-concert-grand/f9-midi-velocity.test.mjs
          node research/stage-concert-grand/f9-midi-listening-sequence.test.mjs
  render:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        midi: [1,4,8,12,16,20,24,36,52,76,100,127]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f9-midi-listening-demo.mjs /tmp/f918a ${{ matrix.midi }}
      - uses: actions/upload-artifact@v4
        with:
          name: F918A-midi${{ matrix.midi }}
          path: /tmp/f918a/
          if-no-files-found: error
  bundle:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: F918A-midi*
          path: /tmp/inputs
      - run: node research/stage-concert-grand/f9-midi-listening-bundle.mjs /tmp/inputs /tmp/listening
      - uses: actions/upload-artifact@v4
        with:
          name: F918A-progressao-MIDI-WAV24
          path: /tmp/listening/
          if-no-files-found: error
