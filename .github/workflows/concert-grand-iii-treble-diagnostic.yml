name: Concert Grand III treble mechanical diagnosis
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/treble_diagnostic.py','research/stage-concert-grand-iii/test_treble_diagnostic.py','.github/workflows/concert-grand-iii-treble-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        key: [60,72,84,96,108]
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/test_treble_diagnostic.py
      - run: python research/stage-concert-grand-iii/treble_diagnostic.py --scale /tmp/g3-scale/scale_geometry.json --key ${{ matrix.key }} --out /tmp/g3-treble
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-treble-diagnostic-${{ matrix.key }}
          path: /tmp/g3-treble/
          if-no-files-found: warn
