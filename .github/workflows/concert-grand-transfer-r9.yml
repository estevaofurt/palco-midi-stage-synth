name: Concert Grand R9 board transfer diagnostic
on:
  push:
    branches: [research/stage-concert-grand]
    paths: ['research/stage-concert-grand/f11u-r9-*.mjs','.github/workflows/concert-grand-transfer-r9.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f11u-r9-transfer.test.mjs
      - run: node research/stage-concert-grand/f11u-r9-demo.mjs /tmp/r9
      - uses: actions/upload-artifact@v4
        with:
          name: R9-board-transfer
          path: /tmp/r9/
          if-no-files-found: error
