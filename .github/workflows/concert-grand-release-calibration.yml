name: Concert Grand release damper calibration
on:
  push:
    branches: [research/stage-concert-grand]
    paths: ['research/stage-concert-grand/f11u-release-*.mjs','.github/workflows/concert-grand-release-calibration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        strength: [1,2,4,8,16]
        caseId: [G7-dry-mf,G7-pedal-mf]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f11u-release-demo.mjs /tmp/release ${{ matrix.caseId }} K750 ${{ matrix.strength }}
      - uses: actions/upload-artifact@v4
        with:
          name: Release-${{ matrix.caseId }}-C${{ matrix.strength }}
          path: /tmp/release/
          if-no-files-found: error
