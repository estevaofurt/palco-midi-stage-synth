name: Concert Grand III archived matrix modal replay
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/coupling_sensitivity.py','research/stage-concert-grand-iii/test_coupling_sensitivity.py','research/stage-concert-grand-iii/acoustic_matrix_archive.py','research/stage-concert-grand-iii/test_acoustic_matrix_archive.py','research/stage-concert-grand-iii/dual_cavity_modal_replay.py','.github/workflows/concert-grand-iii-modal-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - run: python research/stage-concert-grand-iii/test_acoustic_matrix_archive.py
      - run: python research/stage-concert-grand-iii/test_flow_modal_audit.py
      - run: python research/stage-concert-grand-iii/test_coupling_sensitivity.py
  proof:
    needs: unit
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        angle: ['30','55']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '2'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Require completed spatial experiment
        run: |
          test "$(gh run view 45709952931 --json status --jq .status)" = completed
          gh run download 45709952931 -n G3-dual-spatial-${{ matrix.angle }} -D /tmp/g3-spatial
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/dual_cavity_modal_replay.py --scale /tmp/g3-scale/scale_geometry.json --archive /tmp/g3-spatial --angle ${{ matrix.angle }} --out /tmp/g3-modal-replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-modal-replay-${{ matrix.angle }}
          path: /tmp/g3-modal-replay/
          if-no-files-found: warn
