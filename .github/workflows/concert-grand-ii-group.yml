name: Concert Grand II G2.08a shared hammer unison group
on:
  push:
    branches: [research/stage-concert-grand-ii]
    paths: ['research/stage-concert-grand-ii/g2_group_hammer*.mjs','.github/workflows/concert-grand-ii-group.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  group:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand-ii/g2_string_pilot.test.mjs
      - run: node research/stage-concert-grand-ii/g2_hammer_profile.test.mjs
      - run: node research/stage-concert-grand-ii/g2_group_hammer.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G2-group-hammer-numeric
          path: /tmp/g2-group/report.json
          if-no-files-found: error
