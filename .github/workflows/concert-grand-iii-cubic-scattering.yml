name: Concert Grand III cubic aperture and rigid scattering benchmark
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/lid_exterior_cubic_diagnostic.py','research/stage-concert-grand-iii/rigid_scattering*.py','research/stage-concert-grand-iii/test_rigid_scattering.py','.github/workflows/concert-grand-iii-cubic-scattering.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  cubic:
    strategy:
      fail-fast: false
      matrix:
        angle: ['30','55']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/lid_exterior_cubic_diagnostic.py --scale /tmp/g3-scale/scale_geometry.json --angle ${{ matrix.angle }} --out /tmp/g3-cubic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-cubic-${{ matrix.angle }}
          path: /tmp/g3-cubic/
          if-no-files-found: warn
  scattering:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - run: python research/stage-concert-grand-iii/test_rigid_scattering.py
      - run: python research/stage-concert-grand-iii/rigid_scattering_diagnostic.py --out /tmp/g3-scattering
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-rigid-scattering
          path: /tmp/g3-scattering/
          if-no-files-found: warn
