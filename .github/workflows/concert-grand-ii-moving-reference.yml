name: Concert Grand II G2.09a moving boundary reference
on:
  push:
    branches: [research/stage-concert-grand-ii]
    paths: ['research/stage-concert-grand-ii/g2_moving_reference*.mjs','.github/workflows/concert-grand-ii-moving-reference.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand-ii/g2_moving_reference.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G2-moving-reference-numeric
          path: /tmp/g2-moving/report.json
          if-no-files-found: error
