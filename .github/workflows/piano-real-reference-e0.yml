name: Stage Synth E0 - real piano reference analysis
on:
  push:
    branches:
      - research/real-piano-audio-analysis-e0
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGE_AUDIO_WORKDIR: /tmp/stage-piano-reference-e0
      STAGE_PIANO_SELECTION: C4:mf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify audio decoders
        run: |
          command -v ffmpeg
          command -v ffprobe
          npm run check
      - name: Download original public recording into runner-only temporary directory
        run: python3 scripts/fetch_iowa_reference.py
      - name: Measure real Steinway and compare with all three piano engines
        run: |
          node scripts/analyze_reference_audio.mjs "$STAGE_AUDIO_WORKDIR/manifest.json" "$STAGE_AUDIO_WORKDIR/e0-report.json"
      - name: Publish only numeric measurements and source hashes
        uses: actions/upload-artifact@v4
        with:
          name: piano-real-reference-e0-summary
          path: /tmp/stage-piano-reference-e0/e0-report.json
          retention-days: 14
          if-no-files-found: error
      - name: Delete external audio samples from runner
        if: always()
        run: rm -rf /tmp/stage-piano-reference-e0
