name: Concert Grand II G2.08d band and treble diagnosis
on:
  push:
    branches: [research/stage-concert-grand-ii]
    paths: ['research/stage-concert-grand-ii/g2_integrated_band.test.mjs','research/stage-concert-grand-ii/g2_integrated_group.mjs','.github/workflows/concert-grand-ii-integrated-band.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand-ii/g2_integrated_group.test.mjs
      - run: node research/stage-concert-grand-ii/g2_integrated_band.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G2-integrated-band-numeric
          path: /tmp/g2-integrated-band/report.json
          if-no-files-found: error
