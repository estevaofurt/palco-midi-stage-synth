name: Concert Grand III smooth surface quadrature and local angular load
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/high_modal_surface_audit.py','research/stage-concert-grand-iii/test_high_modal_surface_audit.py','research/stage-concert-grand-iii/test_exterior_angular_load.py','.github/workflows/concert-grand-iii-high-modal-surface.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        angle: ['30','55']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '2'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Require complete archives
        run: |
          for r in 45717196561 45720010919; do
            test "$(gh run view "$r" --json conclusion --jq .conclusion)" = success
          done
          gh run download 45717196561 -n G3-high-modal-${{ matrix.angle }} -D /tmp/g3-high-modal
          gh run download 45720010919 -n G3-high-modal-angular-${{ matrix.angle }} -D /tmp/g3-angular
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/test_exterior_angular_load.py
      - run: python research/stage-concert-grand-iii/test_high_modal_surface_audit.py
      - run: python research/stage-concert-grand-iii/high_modal_surface_audit.py --scale /tmp/g3-scale/scale_geometry.json --archive /tmp/g3-high-modal --angular /tmp/g3-angular/high_modal_angular.json --angle ${{ matrix.angle }} --out /tmp/g3-smooth-surface
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-high-modal-surface-${{ matrix.angle }}
          path: /tmp/g3-smooth-surface/
          if-no-files-found: warn
