name: Concert Grand II G2.06b hammer characterization
on:
  push:
    branches: [research/stage-concert-grand-ii]
    paths: ['research/stage-concert-grand-ii/g2_hammer_character*.mjs','.github/workflows/concert-grand-ii-hammer-character.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand-ii/g2_string_pilot.test.mjs
      - run: node research/stage-concert-grand-ii/g2_hammer_pilot.test.mjs
      - run: node research/stage-concert-grand-ii/g2_hammer_character.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: G2-hammer-character-numeric
          path: /tmp/g2-character/report.json
          if-no-files-found: error
