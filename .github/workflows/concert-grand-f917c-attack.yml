name: Concert Grand F9.17c verified quiet attack audit
on:
  push:
    branches: [research/stage-concert-grand]
    paths:
      - '.github/workflows/concert-grand-f917c-attack.yml'
      - 'research/stage-concert-grand/f9-ultraquiet-attack-*'
  workflow_dispatch:
    inputs:
      render_run_id:
        description: 'Completed F9.17c run ID (verified comparison bundle)'
        required: true
        default: '45462131637'
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.render_run_id || '45462131637' }}
          name: F917C-very-quiet-comparison-24bit
          path: /tmp/input
      - run: |
          node research/stage-concert-grand/f9-attack-spectrum.test.mjs
          node research/stage-concert-grand/f9-ultraquiet-attack-analysis.test.mjs
          node research/stage-concert-grand/f9-ultraquiet-attack-demo.mjs /tmp/input /tmp/attack.json
      - uses: actions/upload-artifact@v4
        with:
          name: F917C-attack-numeric
          path: /tmp/attack.json
          if-no-files-found: error
