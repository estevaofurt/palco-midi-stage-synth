name: Concert Grand III foundation contract
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/**','.github/workflows/concert-grand-iii-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/stage-concert-grand-iii/validate_contract.py
      - run: python research/stage-concert-grand-iii/test_contract.py
      - run: python research/stage-concert-grand-iii/test_physical_inventory.py
      - run: python research/stage-concert-grand-iii/physical_inventory.py --out /tmp/g3-inventory
      - uses: actions/upload-artifact@v4
        with:
          name: G3-physical-parameter-inventory
          path: /tmp/g3-inventory/
          if-no-files-found: error
      - run: python research/stage-concert-grand-iii/test_scale_hypothesis.py
      - run: python research/stage-concert-grand-iii/scale_hypothesis.py --out /tmp/g3-scale
      - uses: actions/upload-artifact@v4
        with:
          name: G3-scale-hypothesis-01
          path: /tmp/g3-scale/
          if-no-files-found: error
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - run: python research/stage-concert-grand-iii/test_wound_modes.py
        env:
          OPENBLAS_NUM_THREADS: '1'
      - run: python research/stage-concert-grand-iii/wound_modes.py --out /tmp/g3-wound
        env:
          OPENBLAS_NUM_THREADS: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: G3-wound-mode-screen
          path: /tmp/g3-wound/
          if-no-files-found: error
      - run: python research/stage-concert-grand-iii/test_scale_geometry.py
        env:
          OPENBLAS_NUM_THREADS: '1'
      - run: python research/stage-concert-grand-iii/scale_geometry.py --wound /tmp/g3-wound/wound_modes.json --out /tmp/g3-geometry
        env:
          OPENBLAS_NUM_THREADS: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: G3-scale-geometry-02
          path: /tmp/g3-geometry/
          if-no-files-found: error
      - run: python research/stage-concert-grand-iii/test_spatial_layout.py
        env:
          OPENBLAS_NUM_THREADS: '1'
      - run: python research/stage-concert-grand-iii/spatial_layout.py --scale /tmp/g3-geometry/scale_geometry.json --out /tmp/g3-layout
        env:
          OPENBLAS_NUM_THREADS: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: G3-spatial-layout-01
          path: /tmp/g3-layout/
          if-no-files-found: error
