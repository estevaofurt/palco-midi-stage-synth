name: Concert Grand F9.19c long sustain after rattle correction
on:
  push:
    branches: [research/stage-concert-grand]
    paths:
      - '.github/workflows/concert-grand-f919c.yml'
      - 'research/stage-concert-grand/f9-rattle-long-demo.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node research/stage-concert-grand/f9-rattle-board.test.mjs
          node research/stage-concert-grand/f9-rattle-selective.test.mjs
  render:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        midi: [76, 127]
        candidate: [global4, selective4]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f9-rattle-long-demo.mjs /tmp/f919c ${{ matrix.midi }} ${{ matrix.candidate }}
      - uses: actions/upload-artifact@v4
        with:
          name: F919C-midi${{ matrix.midi }}-${{ matrix.candidate }}
          path: /tmp/f919c/
          if-no-files-found: error
