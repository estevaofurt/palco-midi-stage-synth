name: Stage Synth - commercial-reference provenance audit
on:
  push:
    branches:
      - research/commercial-data-preparation-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-vcsl-original-wavs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGE_COMMERCIAL_AUDIO_DIR: /tmp/stage-commercial-reference-vcsl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline provenance / path traversal unit tests
        run: python3 -m unittest discover -s research/commercial_audio -p 'test_*.py' -v
      - name: Validate eight original VCSL CC0 source WAVs in runner temporary directory
        run: |
          mkdir -p "$STAGE_COMMERCIAL_AUDIO_DIR"
          python3 research/commercial_audio/verify_vcsl.py \
            research/commercial_audio/vcsl_cc0_pilot_manifest.json \
            "$STAGE_COMMERCIAL_AUDIO_DIR/verified.json"
      - name: Install and verify lossless FLAC decoder
        run: |
          if ! command -v flac >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq flac
          fi
          flac --version
      - name: Validate 14 Yamaha C5 and Kawai KW original lossless FLAC samples
        run: |
          python3 research/commercial_audio/verify_flac.py \
            research/commercial_audio/cc_flac_pilot_manifest.json \
            "$STAGE_COMMERCIAL_AUDIO_DIR/flac-verified.json"
      - name: Archive ONLY provenance hashes and acoustic file-header metadata
        uses: actions/upload-artifact@v4
        with:
          name: stage-commercial-reference-vcsl-metadata-only
          path: |
            /tmp/stage-commercial-reference-vcsl/verified.json
            /tmp/stage-commercial-reference-vcsl/flac-verified.json
          retention-days: 14
          if-no-files-found: error
      - name: Delete source recordings and report from CI runner
        if: always()
        run: rm -rf /tmp/stage-commercial-reference-vcsl
