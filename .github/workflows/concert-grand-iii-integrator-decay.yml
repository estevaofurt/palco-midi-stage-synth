name: Concert Grand III integrator numerical decay
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/integrator_decay.py','research/stage-concert-grand-iii/test_integrator_decay.py','.github/workflows/concert-grand-iii-integrator-decay.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/stage-concert-grand-iii/test_integrator_decay.py
      - run: python research/stage-concert-grand-iii/integrator_decay.py --out /tmp/g3-integrator-decay
      - uses: actions/upload-artifact@v4
        with:
          name: G3-integrator-decay
          path: /tmp/g3-integrator-decay/
