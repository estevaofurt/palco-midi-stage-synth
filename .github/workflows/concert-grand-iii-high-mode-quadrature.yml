name: Concert Grand III representative 55-mode quadrature convergence
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/high_mode_quadrature_audit.py','research/stage-concert-grand-iii/test_high_mode_quadrature_audit.py','.github/workflows/concert-grand-iii-high-mode-quadrature.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        angle: ['30','55']
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '2'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: test "$(gh run view 45716920242 --json conclusion --jq .conclusion)" = success
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/test_high_mode_quadrature_audit.py
      - run: python research/stage-concert-grand-iii/high_mode_quadrature_audit.py --scale /tmp/g3-scale/scale_geometry.json --angle ${{ matrix.angle }} --out /tmp/g3-high-quad
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-high-mode-quadrature-${{ matrix.angle }}
          path: /tmp/g3-high-quad/
          if-no-files-found: warn
