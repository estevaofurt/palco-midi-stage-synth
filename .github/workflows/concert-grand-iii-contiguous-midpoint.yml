name: Concert Grand III contiguous midpoint stress
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/contiguous_midpoint.py','research/stage-concert-grand-iii/test_contiguous_midpoint.py','.github/workflows/concert-grand-iii-contiguous-midpoint.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3 numba==0.61.2
      - run: python research/stage-concert-grand-iii/test_contiguous_midpoint.py
      - run: python research/stage-concert-grand-iii/contiguous_midpoint.py --out /tmp/g3-layout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-contiguous-midpoint
          path: /tmp/g3-layout/
          if-no-files-found: warn
