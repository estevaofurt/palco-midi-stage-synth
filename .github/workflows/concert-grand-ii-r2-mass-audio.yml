name: Concert Grand II R2c mass candidate proof and note audio
on:
  push:
    branches: [research/stage-concert-grand-ii]
    paths: ['research/stage-concert-grand-ii/g2_r2_mass_audio.py','.github/workflows/concert-grand-ii-r2-mass-audio.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        key: ${{ fromJSON(contains(github.event.head_commit.message, '[R2c-c4-repair]') && '[60]' || '[60,64,67,72]') }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3 soundfile==0.13.1
      - run: node research/stage-concert-grand-ii/g2_shared_board_export.mjs
      - run: node research/stage-concert-grand-ii/g2_octave_export.mjs
      - uses: actions/download-artifact@v4
        with:
          name: G2-R2-mass-${{ matrix.key }}
          run-id: 45624274809
          github-token: ${{ github.token }}
          path: /tmp/screen
      - uses: actions/download-artifact@v4
        if: matrix.key == 60
        with:
          name: G2-R1-C4-held-dry
          run-id: 45617749735
          github-token: ${{ github.token }}
          path: /tmp/r1-held
      - run: python research/stage-concert-grand-ii/g2_r2_mass_audio.py --key ${{ matrix.key }} --screen /tmp/screen --baseline /tmp/r1-held --out /tmp/audio
      - uses: actions/upload-artifact@v4
        with:
          name: G2-R2C-note-${{ matrix.key }}
          path: /tmp/audio/
          if-no-files-found: error
