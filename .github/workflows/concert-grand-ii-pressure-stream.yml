name: Concert Grand II offline pressure streaming
on:
  push:
    branches: [research/stage-concert-grand-ii]
    paths: ['research/stage-concert-grand-ii/g2_pressure_stream*.py','.github/workflows/concert-grand-ii-pressure-stream.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - run: python -m py_compile research/stage-concert-grand-ii/g2_pressure_stream.py research/stage-concert-grand-ii/g2_pressure_stream_test.py
      - run: python research/stage-concert-grand-ii/g2_pressure_stream_test.py
