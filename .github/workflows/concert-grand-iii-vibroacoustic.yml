name: Concert Grand III coupled passive acoustic modes
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/vibroacoustic*.py','research/stage-concert-grand-iii/test_vibroacoustic_coupling.py','.github/workflows/concert-grand-iii-vibroacoustic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - run: python research/stage-concert-grand-iii/test_vibroacoustic_coupling.py
      - run: python research/stage-concert-grand-iii/vibroacoustic_diagnostic.py --out /tmp/g3-vibro
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-vibroacoustic
          path: /tmp/g3-vibro/
          if-no-files-found: warn
