name: Concert Grand F9.16a strike position sensitivity
on:
  push:
    branches: [research/stage-concert-grand]
    paths:
      - '.github/workflows/concert-grand-f916a.yml'
      - 'research/stage-concert-grand/f9-strike-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node research/stage-concert-grand/f9-string-loss.test.mjs
          node research/stage-concert-grand/f9-strike-render.test.mjs
  render:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        position: [0.08, 0.1]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f9-strike-demo.mjs /tmp/f916a 20 1 .5 .5 .5 both-half ${{ matrix.position }}
      - run: node research/stage-concert-grand/f9-f99-summary.mjs /tmp/f916a/C4_v1_board0.5_angle0.5_spread0.5_both-half_strike${{ matrix.position }}_20s_float_analysis.json FLOAT
      - uses: actions/upload-artifact@v4
        with:
          name: F916A-strike-${{ matrix.position }}-20s
          path: /tmp/f916a/
          if-no-files-found: error
