name: Concert Grand F9.19e hybrid long sustain
on:
  push:
    branches: [research/stage-concert-grand]
    paths:
      - '.github/workflows/concert-grand-f919e.yml'
      - 'research/stage-concert-grand/f9-rattle-long-hybrid-demo.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f9-rattle-hybrid.test.mjs
  render:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        midi: [76, 127]
        multiplier: [3, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f9-rattle-long-hybrid-demo.mjs /tmp/f919e ${{ matrix.midi }} ${{ matrix.multiplier }}
      - uses: actions/upload-artifact@v4
        with:
          name: F919E-midi${{ matrix.midi }}-hybridGlobal${{ matrix.multiplier }}
          path: /tmp/f919e/
          if-no-files-found: error
