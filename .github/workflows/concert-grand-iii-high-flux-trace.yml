name: Concert Grand III higher aperture modal trace screening
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/high_flux_trace_diagnostic.py','research/stage-concert-grand-iii/test_high_flux_basis.py','.github/workflows/concert-grand-iii-high-flux-trace.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        angle: ['30','55']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '2'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: test "$(gh run view 45716637625 --json conclusion --jq .conclusion)" = success
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/test_high_flux_basis.py
      - run: python research/stage-concert-grand-iii/test_extended_flux_basis.py
      - run: python research/stage-concert-grand-iii/high_flux_trace_diagnostic.py --scale /tmp/g3-scale/scale_geometry.json --angle ${{ matrix.angle }} --out /tmp/g3-high-flux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-high-flux-trace-${{ matrix.angle }}
          path: /tmp/g3-high-flux/
          if-no-files-found: warn
