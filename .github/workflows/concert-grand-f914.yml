name: Concert Grand F9.14 passive damper and pedal
on:
  push:
    branches: [research/stage-concert-grand]
    paths:
      - '.github/workflows/concert-grand-f914.yml'
      - 'research/stage-concert-grand/f9-damper*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node research/stage-concert-grand/f9-damper.test.mjs
          node research/stage-concert-grand/f9-damper-render.test.mjs
          node research/stage-concert-grand/f9-sympathetic-render.test.mjs
  render:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        pedal: [0, 0.5, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f9-damper-demo.mjs /tmp/f914 3 1 .5 .5 .5 both-half off ${{ matrix.pedal }}
      - uses: actions/upload-artifact@v4
        with:
          name: F914-pedal-${{ matrix.pedal }}
          path: /tmp/f914/
          if-no-files-found: error
