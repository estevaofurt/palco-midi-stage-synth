name: Concert Grand III geometry derived retarded acoustic load
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/retarded_load.py','research/stage-concert-grand-iii/test_retarded_load.py','.github/workflows/concert-grand-iii-retarded-load.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3 numba==0.61.2
      - run: python research/stage-concert-grand-iii/test_retarded_coordinates.py && python research/stage-concert-grand-iii/test_retarded_load.py
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - uses: actions/download-artifact@v4
        with:
          name: G3-wire-port-enrichment
          run-id: 45742331448
          github-token: ${{ github.token }}
          path: /tmp/g3-wire
      - uses: actions/download-artifact@v4
        with:
          name: G3-wire-baffle-reference
          run-id: 45774796464
          github-token: ${{ github.token }}
          path: /tmp/g3-baffle
      - uses: actions/download-artifact@v4
        with:
          name: G3-hybrid-surface
          run-id: 45737081748
          github-token: ${{ github.token }}
          path: /tmp/g3-surface
      - uses: actions/download-artifact@v4
        with:
          name: G3-new-baffle-grid
          run-id: 45775653803
          github-token: ${{ github.token }}
          path: /tmp/g3-grid
      - run: python research/stage-concert-grand-iii/retarded_load.py --scale /tmp/g3-scale/scale_geometry.json --source /tmp/g3-wire --reference /tmp/g3-baffle --grid /tmp/g3-grid --surface /tmp/g3-surface --out /tmp/g3-retarded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-retarded-load
          path: /tmp/g3-retarded/
          if-no-files-found: warn
