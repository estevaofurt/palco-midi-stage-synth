name: Concert Grand II G2.09g independent acoustic observer
on:
  push:
    branches: [research/stage-concert-grand-ii]
    paths: ['research/stage-concert-grand-ii/g2_radiation*','.github/workflows/concert-grand-ii-radiation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - run: python -m py_compile research/stage-concert-grand-ii/g2_radiation.py research/stage-concert-grand-ii/g2_radiation_test.py
      - run: node research/stage-concert-grand-ii/g2_radiation_export.mjs
      - run: python research/stage-concert-grand-ii/g2_radiation_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G2-radiation-observer-numeric
          path: /tmp/g2-radiation/report.json
          if-no-files-found: error
