name: Concert Grand II G2.06c hammer profile verification
on:
  push:
    branches: [research/stage-concert-grand-ii]
    paths: ['research/stage-concert-grand-ii/g2_hammer_profile*.mjs','.github/workflows/concert-grand-ii-hammer-profile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand-ii/g2_hammer_profile.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G2-hammer-profile-numeric
          path: /tmp/g2-hammer-profile/report.json
          if-no-files-found: error
