name: Concert Grand F11r simultaneous hammers shared board
on:
  push:
    branches: [research/stage-concert-grand]
    paths:
      - '.github/workflows/concert-grand-f11r-multi.yml'
      - 'research/stage-concert-grand/f11r-multi-hammer-network*.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f11r-multi-hammer-network.test.mjs
