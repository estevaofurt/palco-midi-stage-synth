name: Concert Grand II G2.07a distributed string decay
on:
  push:
    branches: [research/stage-concert-grand-ii]
    paths: ['research/stage-concert-grand-ii/g2_decay*.mjs','.github/workflows/concert-grand-ii-decay.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand-ii/g2_string_pilot.test.mjs
      - run: node research/stage-concert-grand-ii/g2_hammer_profile.test.mjs
      - run: node research/stage-concert-grand-ii/g2_decay.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: G2-decay-numeric
          path: /tmp/g2-decay/report.json
          if-no-files-found: error
