name: Concert Grand III finite aperture cavity coupling
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/vented_cavity*.py','research/stage-concert-grand-iii/test_vented_cavity.py','.github/workflows/concert-grand-iii-vent.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/test_vented_cavity.py
      - run: python research/stage-concert-grand-iii/vented_cavity_diagnostic.py --scale /tmp/g3-scale/scale_geometry.json --out /tmp/g3-vent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-vented-cavity
          path: /tmp/g3-vent/
          if-no-files-found: warn
