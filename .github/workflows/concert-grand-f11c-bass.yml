name: Concert Grand F11c bass candidate consistency
on:
  push:
    branches: [research/stage-concert-grand]
    paths:
      - '.github/workflows/concert-grand-f11c-bass.yml'
      - 'research/stage-concert-grand/f11c-bass-candidates*.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bass:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f11c-wound-wire.test.mjs
      - run: node research/stage-concert-grand/f11c-bass-candidates.test.mjs
