name: Concert Grand III hybrid temporal and spatial surface
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/hybrid_temporal_surface.py','research/stage-concert-grand-iii/test_hybrid_temporal_surface.py','.github/workflows/concert-grand-iii-hybrid-surface.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3 numba==0.61.2
      - run: python research/stage-concert-grand-iii/test_hybrid_temporal_surface.py
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - uses: actions/download-artifact@v4
        with:
          name: G3-dry-hybrid
          run-id: 45736514863
          github-token: ${{ github.token }}
          path: /tmp/g3-hybrid
      - run: python research/stage-concert-grand-iii/hybrid_temporal_surface.py --scale /tmp/g3-scale/scale_geometry.json --source /tmp/g3-hybrid --out /tmp/g3-surface
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-hybrid-surface
          path: /tmp/g3-surface/
          if-no-files-found: warn
