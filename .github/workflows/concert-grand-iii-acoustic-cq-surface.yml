name: Concert Grand III projected physical surface CQ
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/projected_board_cq.py','research/stage-concert-grand-iii/test_projected_board_cq.py','research/stage-concert-grand-iii/acoustic_cq_pilot.py','research/stage-concert-grand-iii/acoustic_cq_surface.py','research/stage-concert-grand-iii/test_acoustic_cq_surface.py','.github/workflows/concert-grand-iii-acoustic-cq-surface.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        rate: [48000, 96000]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3 numba==0.61.2
      - run: python research/stage-concert-grand-iii/test_acoustic_cq_surface.py && python research/stage-concert-grand-iii/test_projected_board_cq.py
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - uses: actions/download-artifact@v4
        with:
          name: G3-wire-port-enrichment
          run-id: 45742331448
          github-token: ${{ github.token }}
          path: /tmp/g3-wire
      - uses: actions/download-artifact@v4
        with:
          name: G3-hybrid-surface
          run-id: 45737081748
          github-token: ${{ github.token }}
          path: /tmp/g3-surface
      - run: python research/stage-concert-grand-iii/acoustic_cq_surface.py --scale /tmp/g3-scale/scale_geometry.json --source /tmp/g3-wire --surface /tmp/g3-surface --rate ${{ matrix.rate }} --out /tmp/g3-cq-surface
      - uses: actions/upload-artifact@v4
        with:
          name: G3-cq-surface-${{ matrix.rate }}
          path: /tmp/g3-cq-surface/
