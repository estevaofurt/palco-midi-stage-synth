name: Concert Grand III direct exterior Neumann envelope
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/exterior_neumann*.py','research/stage-concert-grand-iii/neumann_envelope.py','research/stage-concert-grand-iii/test_exterior_neumann.py','.github/workflows/concert-grand-iii-exterior-neumann.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        angle: ['30','55']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/test_exterior_neumann.py
      - run: python research/stage-concert-grand-iii/exterior_neumann_diagnostic.py --scale /tmp/g3-scale/scale_geometry.json --angle ${{ matrix.angle }} --out /tmp/g3-neumann
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-exterior-neumann-${{ matrix.angle }}
          path: /tmp/g3-neumann/
          if-no-files-found: warn
