name: Concert Grand III frozen regional acoustic loss
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/frozen_regional_loss.py','research/stage-concert-grand-iii/test_frozen_regional_loss.py','.github/workflows/concert-grand-iii-frozen-regional-loss.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        speed: ['0.3','3.0']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3 numba==0.61.2
      - run: python research/stage-concert-grand-iii/test_frozen_regional_loss.py
      - run: timeout 125m gh run watch 45865381764 --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
      - uses: actions/download-artifact@v4
        with:
          name: G3-physical-long-${{ matrix.speed }}
          run-id: 45865381764
          github-token: ${{ github.token }}
          path: /tmp/g3-bundle
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - uses: actions/download-artifact@v4
        with:
          name: G3-wire-port-enrichment
          run-id: 45742331448
          github-token: ${{ github.token }}
          path: /tmp/g3-wire
      - run: python research/stage-concert-grand-iii/frozen_regional_loss.py --scale /tmp/g3-scale/scale_geometry.json --source /tmp/g3-wire --bundle /tmp/g3-bundle --out /tmp/g3-frozen-loss
      - uses: actions/upload-artifact@v4
        with:
          name: G3-frozen-regional-loss-${{ matrix.speed }}
          path: /tmp/g3-frozen-loss/
