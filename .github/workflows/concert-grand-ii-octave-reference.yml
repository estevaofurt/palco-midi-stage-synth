name: Concert Grand II G2.11 reference musical scores
on:
  push:
    branches: [research/stage-concert-grand-ii]
    paths: ['research/stage-concert-grand-ii/g2_octave_score.json','research/stage-concert-grand-ii/g2_octave_reference.py','.github/workflows/concert-grand-ii-octave-reference.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3 soundfile==0.13.1
      - run: python research/stage-concert-grand-ii/g2_octave_reference.py --out /tmp/g2-octave-ref
      - uses: actions/upload-artifact@v4
        with:
          name: G2-11-musical-reference-only
          path: /tmp/g2-octave-ref/
          if-no-files-found: error
