name: Concert Grand III mechanical loss sensitivity
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/physical_loss_sensitivity.py','research/stage-concert-grand-iii/test_physical_loss_sensitivity.py','.github/workflows/concert-grand-iii-loss-sensitivity.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3 numba==0.61.2
      - run: python research/stage-concert-grand-iii/test_physical_loss_sensitivity.py
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - uses: actions/download-artifact@v4
        with:
          name: G3-wire-port-enrichment
          run-id: 45742331448
          github-token: ${{ github.token }}
          path: /tmp/g3-wire
      - uses: actions/download-artifact@v4
        with:
          name: G3-physical-pedal
          run-id: 45772814404
          github-token: ${{ github.token }}
          path: /tmp/g3-pedal
      - run: python research/stage-concert-grand-iii/physical_loss_sensitivity.py --scale /tmp/g3-scale/scale_geometry.json --source /tmp/g3-wire --pedal /tmp/g3-pedal --out /tmp/g3-loss-sensitivity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-physical-loss-sensitivity
          path: /tmp/g3-loss-sensitivity/
          if-no-files-found: warn
