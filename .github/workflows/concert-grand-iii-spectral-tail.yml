name: Concert Grand III spectral tail across notes and controls
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/spectral_tail_audit.py','research/stage-concert-grand-iii/test_spectral_tail_audit.py','.github/workflows/concert-grand-iii-spectral-tail.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  existing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3 numba==0.61.2
      - run: python research/stage-concert-grand-iii/test_spectral_tail_audit.py
      - uses: actions/download-artifact@v4
        with:
          name: G3-dry-physical-pressure-WAV
          run-id: 45794785271
          github-token: ${{ github.token }}
          path: /tmp/g3-wav
      - run: python research/stage-concert-grand-iii/spectral_tail_audit.py --existing /tmp/g3-wav --out /tmp/g3-existing
      - uses: actions/upload-artifact@v4
        with:
          name: G3-existing-spectral-tails
          path: /tmp/g3-existing/
  controls:
    needs: existing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: ['held_no_pedal','release_no_pedal','45','48','64']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3 numba==0.61.2
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - uses: actions/download-artifact@v4
        with:
          name: G3-wire-port-enrichment
          run-id: 45742331448
          github-token: ${{ github.token }}
          path: /tmp/g3-wire
      - uses: actions/download-artifact@v4
        with:
          name: G3-wire-baffle-reference
          run-id: 45774796464
          github-token: ${{ github.token }}
          path: /tmp/g3-baffle
      - uses: actions/download-artifact@v4
        with:
          name: G3-causal-pressure-observer
          run-id: 45775031314
          github-token: ${{ github.token }}
          path: /tmp/g3-pressure
      - run: python research/stage-concert-grand-iii/spectral_tail_audit.py --group '${{ matrix.group }}' --scale /tmp/g3-scale/scale_geometry.json --source /tmp/g3-wire --reference /tmp/g3-baffle --pressure /tmp/g3-pressure --out /tmp/g3-control
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-spectral-tail-${{ matrix.group }}
          path: /tmp/g3-control/
          if-no-files-found: warn
