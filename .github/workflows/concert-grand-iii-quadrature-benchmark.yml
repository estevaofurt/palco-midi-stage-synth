name: Concert Grand III representative quadrature resource benchmark
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/exterior_quadrature_benchmark.py','.github/workflows/concert-grand-iii-quadrature-benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        angle: ['30','55']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Require quadrature equivalence
        run: |
          test "$(gh run view 45711116570 --json conclusion --jq .conclusion)" = success
          test "$(gh run view 45712151975 --json conclusion --jq .conclusion)" = success
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/exterior_quadrature_benchmark.py --scale /tmp/g3-scale/scale_geometry.json --angle ${{ matrix.angle }} --out /tmp/g3-quadrature-benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-quadrature-benchmark-${{ matrix.angle }}
          path: /tmp/g3-quadrature-benchmark/
          if-no-files-found: warn
