name: Concert Grand III retarded surface impedance
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/retarded_surface.py','research/stage-concert-grand-iii/test_retarded_surface.py','.github/workflows/concert-grand-iii-retarded-surface.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3 numba==0.61.2
      - run: python research/stage-concert-grand-iii/test_retarded_coordinates.py && python research/stage-concert-grand-iii/test_retarded_surface.py
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - uses: actions/download-artifact@v4
        with:
          name: G3-wire-port-enrichment
          run-id: 45742331448
          github-token: ${{ github.token }}
          path: /tmp/g3-wire
      - uses: actions/download-artifact@v4
        with:
          name: G3-hybrid-surface
          run-id: 45737081748
          github-token: ${{ github.token }}
          path: /tmp/g3-surface
      - uses: actions/download-artifact@v4
        with:
          name: G3-wire-baffle-reference
          run-id: 45774796464
          github-token: ${{ github.token }}
          path: /tmp/g3-baffle
      - run: python research/stage-concert-grand-iii/retarded_surface.py --scale /tmp/g3-scale/scale_geometry.json --source /tmp/g3-wire --surface /tmp/g3-surface --reference /tmp/g3-baffle --out /tmp/g3-retarded-surface
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-retarded-surface
          path: /tmp/g3-retarded-surface/
          if-no-files-found: warn
