name: Concert Grand III independent strip audit at three frequencies
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/bem_strip_audit*.py','research/stage-concert-grand-iii/test_bem_strip_audit.py','.github/workflows/concert-grand-iii-strip-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        angle: ['30','55']
        frequency: ['30','80','150']
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '2'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - run: python research/stage-concert-grand-iii/test_bem_strip_audit.py
      - name: Require matched comparison
        run: test "$(gh run view 45705092115 --json conclusion --jq .conclusion)" = success
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/bem_strip_audit_diagnostic.py --scale /tmp/g3-scale/scale_geometry.json --angle ${{ matrix.angle }} --frequency ${{ matrix.frequency }} --out /tmp/g3-strip-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-strip-audit-${{ matrix.angle }}-${{ matrix.frequency }}
          path: /tmp/g3-strip-audit/
          if-no-files-found: warn
