name: Concert Grand III enriched baffle frequency grid
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/baffle_frequency_grid.py','research/stage-concert-grand-iii/test_baffle_frequency_grid.py','.github/workflows/concert-grand-iii-baffle-grid.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        role: [training,validation]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3 numba==0.61.2
      - run: python research/stage-concert-grand-iii/test_baffle_frequency_grid.py
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - uses: actions/download-artifact@v4
        with:
          name: G3-hybrid-surface
          run-id: 45737081748
          github-token: ${{ github.token }}
          path: /tmp/g3-surface
      - uses: actions/download-artifact@v4
        with:
          name: G3-surface-reactive
          run-id: 45740774374
          github-token: ${{ github.token }}
          path: /tmp/g3-reactive
      - run: python research/stage-concert-grand-iii/baffle_frequency_grid.py --scale /tmp/g3-scale/scale_geometry.json --source /tmp/g3-surface --previous /tmp/g3-reactive --role ${{ matrix.role }} --out /tmp/g3-grid
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-baffle-grid-${{ matrix.role }}
          path: /tmp/g3-grid/
          if-no-files-found: warn
