name: Concert Grand III targeted disjoint edge quadrature 55
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['.github/workflows/concert-grand-iii-disjoint-enriched-55.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - run: |
          for r in 45717196561 45723509912 45722209678; do
            test "$(gh run view "$r" --json conclusion --jq .conclusion)" = success
          done
          gh run download 45717196561 -n G3-high-modal-55 -D /tmp/g3-high
          gh run download 45723509912 -n G3-consolidated-exterior-55 -D /tmp/g3-ext
          gh run download 45722209678 -n G3-graded-edge-trace-55 -D /tmp/g3-trace
          gh run download 45725732251 -n G3-enriched-reactive-55-disjoint -D /tmp/g3-prev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/test_disjoint_enriched_refinement.py
      - run: python research/stage-concert-grand-iii/disjoint_enriched_refinement.py --scale /tmp/g3-scale/scale_geometry.json --archive /tmp/g3-high --consolidated /tmp/g3-ext --trace /tmp/g3-trace/graded_edge_trace.json --previous /tmp/g3-prev --angle 55 --out /tmp/g3-refine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-disjoint-refinement-55
          path: /tmp/g3-refine/
          if-no-files-found: warn
