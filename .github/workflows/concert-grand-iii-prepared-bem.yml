name: Concert Grand III prepared BEM source quadrature
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/bem_prepared_operator.py','research/stage-concert-grand-iii/test_bem_prepared_operator.py','research/stage-concert-grand-iii/bem_prepared_benchmark.py','.github/workflows/concert-grand-iii-prepared-bem.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '2'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/jobs/139564362420 --jq .conclusion)" = success
          gh run download 45716637733 -n G3-candidate-proof-30 -D /tmp/g3-candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/test_bem_weak_blocked.py
      - run: python research/stage-concert-grand-iii/test_bem_prepared_operator.py
      - run: python research/stage-concert-grand-iii/bem_prepared_benchmark.py --scale /tmp/g3-scale/scale_geometry.json --archive /tmp/g3-candidate --out /tmp/g3-prepared
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-prepared-bem-30
          path: /tmp/g3-prepared/
          if-no-files-found: warn
