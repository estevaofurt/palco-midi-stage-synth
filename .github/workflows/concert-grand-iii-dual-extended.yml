name: Concert Grand III extended dual cavity flow convergence
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/flow_modal_audit.py','research/stage-concert-grand-iii/test_flow_modal_audit.py','research/stage-concert-grand-iii/dual_cavity_extended_diagnostic.py','.github/workflows/concert-grand-iii-dual-extended.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - run: python research/stage-concert-grand-iii/test_flow_modal_audit.py
      - run: python research/stage-concert-grand-iii/test_extended_flux_basis.py
  proof:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        angle: ['30','55']
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '2'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Require prior integrated proof
        run: |
          test "$(gh run view 45702919527 --json conclusion --jq .conclusion)" = success
          test "$(gh run view 45705680184 --json conclusion --jq .conclusion)" = success
          gh run download 45702919527 -n G3-dual-reference-${{ matrix.angle }} -D /tmp/g3-prior
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/dual_cavity_extended_diagnostic.py --scale /tmp/g3-scale/scale_geometry.json --previous /tmp/g3-prior/dual_cavity_reference.json --angle ${{ matrix.angle }} --out /tmp/g3-dual-extended
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-dual-extended-${{ matrix.angle }}
          path: /tmp/g3-dual-extended/
          if-no-files-found: warn
