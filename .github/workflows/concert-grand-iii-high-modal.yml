name: Concert Grand III screened 385-mode common exterior reference
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/dual_cavity_high_modal_diagnostic.py','research/stage-concert-grand-iii/test_dual_cavity_high_modal.py','.github/workflows/concert-grand-iii-high-modal.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        angle: ['30','55']
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      OPENBLAS_NUM_THREADS: '2'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Require completed prerequisites
        run: |
          for r in 45709952931 45716637625 45716920242 45711334255 45712376907; do
            test "$(gh run view "$r" --json conclusion --jq .conclusion)" = success
          done
          gh run download 45716920242 -n G3-high-flux-trace-${{ matrix.angle }} -D /tmp/g3-screen
          gh run download 45709952931 -n G3-dual-spatial-${{ matrix.angle }} -D /tmp/g3-spatial
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/test_dual_cavity_high_modal.py
      - run: python research/stage-concert-grand-iii/test_high_flux_basis.py
      - run: python research/stage-concert-grand-iii/test_hybrid_real_harmonic.py
      - run: python research/stage-concert-grand-iii/dual_cavity_high_modal_diagnostic.py --scale /tmp/g3-scale/scale_geometry.json --screen /tmp/g3-screen/high_flux_trace.json --archive /tmp/g3-spatial --angle ${{ matrix.angle }} --out /tmp/g3-high-modal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-high-modal-${{ matrix.angle }}
          path: /tmp/g3-high-modal/
          if-no-files-found: warn
