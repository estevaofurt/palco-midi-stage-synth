name: Concert Grand II G2.11 octave and triad diagnostics
on:
  push:
    branches: [research/stage-concert-grand-ii]
    paths: ['research/stage-concert-grand-ii/g2_musical_diagnostics.py','.github/workflows/concert-grand-ii-musical-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3 soundfile==0.13.1
      - uses: actions/download-artifact@v4
        with:
          pattern: G2-11-audit-*
          run-id: 45612682505
          github-token: ${{ github.token }}
          path: /tmp/g2-audit
      - run: python research/stage-concert-grand-ii/g2_musical_diagnostics.py --root /tmp/g2-audit --out /tmp/g2-diagnostic
      - uses: actions/upload-artifact@v4
        with:
          name: G2-11-octave-triad-diagnostic
          path: /tmp/g2-diagnostic/
          if-no-files-found: error
