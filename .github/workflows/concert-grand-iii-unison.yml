name: Concert Grand III shared unison and C6 refinement
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/shared_unison.py','research/stage-concert-grand-iii/unison_diagnostic.py','research/stage-concert-grand-iii/test_shared_unison.py','research/stage-concert-grand-iii/c6_loaded_refinement.py','.github/workflows/concert-grand-iii-unison.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        key: [49,60,84]
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/test_shared_unison.py
      - if: matrix.key == 84
        run: python research/stage-concert-grand-iii/c6_loaded_refinement.py --scale /tmp/g3-scale/scale_geometry.json --out /tmp/g3-c6
      - if: matrix.key == 84
        uses: actions/upload-artifact@v4
        with:
          name: G3-C6-loaded-refinement
          path: /tmp/g3-c6/
          if-no-files-found: error
      - run: python research/stage-concert-grand-iii/unison_diagnostic.py --scale /tmp/g3-scale/scale_geometry.json --key ${{ matrix.key }} --out /tmp/g3-unison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-shared-unison-${{ matrix.key }}
          path: /tmp/g3-unison/
          if-no-files-found: warn
