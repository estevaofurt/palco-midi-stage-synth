name: Concert Grand III dry hybrid resonance reduction
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/dry_hybrid_reduction.py','research/stage-concert-grand-iii/test_dry_hybrid_reduction.py','.github/workflows/concert-grand-iii-dry-hybrid.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - run: python research/stage-concert-grand-iii/test_dry_hybrid_reduction.py
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/dry_hybrid_reduction.py --scale /tmp/g3-scale/scale_geometry.json --out /tmp/g3-hybrid
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-dry-hybrid
          path: /tmp/g3-hybrid/
          if-no-files-found: warn
