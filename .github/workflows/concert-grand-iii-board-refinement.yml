name: Concert Grand III soundboard basis and rim refinement
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/spline_plate*.py','research/stage-concert-grand-iii/test_spline_plate.py','research/stage-concert-grand-iii/interface_refinement.py','.github/workflows/concert-grand-iii-board-refinement.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  polygon:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/test_spline_plate.py
      - run: python research/stage-concert-grand-iii/spline_plate_diagnostic.py --scale /tmp/g3-scale/scale_geometry.json --out /tmp/g3-spline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-spline-plate
          path: /tmp/g3-spline/
          if-no-files-found: warn
  rectangle:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/interface_refinement.py --scale /tmp/g3-scale/scale_geometry.json --out /tmp/g3-interface-refinement
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-interface-refinement
          path: /tmp/g3-interface-refinement/
          if-no-files-found: warn
