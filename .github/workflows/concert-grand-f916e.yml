name: Concert Grand F9.16e radiation resistance refinement
on:
  push:
    branches: [research/stage-concert-grand]
    paths:
      - '.github/workflows/concert-grand-f916e.yml'
      - 'research/stage-concert-grand/f9-radiation-refinement*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node research/stage-concert-grand/f9-string-loss.test.mjs
          node research/stage-concert-grand/f9-radiation-refinement.test.mjs
  render:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        quadrature: [medium, fine]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f9-radiation-refinement-demo.mjs /tmp/f916e 20 1 .5 .5 .5 both-half ${{ matrix.quadrature }}
      - run: node research/stage-concert-grand/f9-f99-summary.mjs /tmp/f916e/C4_v1_board0.5_angle0.5_spread0.5_both-half_${{ matrix.quadrature }}_20s_float_analysis.json FLOAT
      - uses: actions/upload-artifact@v4
        with:
          name: F916E-${{ matrix.quadrature }}-20s
          path: /tmp/f916e/
          if-no-files-found: error
