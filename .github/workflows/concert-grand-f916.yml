name: Concert Grand F9.16 harmonic reference comparison
on:
  push:
    branches: [research/stage-concert-grand]
    paths:
      - '.github/workflows/concert-grand-f916.yml'
      - 'research/stage-concert-grand/f9-harmonic-comparison*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'soundfile>=0.12,<1'
      - name: Unit tests
        run: |
          node research/stage-concert-grand/f9-long-analysis.test.mjs
          node research/stage-concert-grand/f9-decay-analysis.test.mjs
          node research/stage-concert-grand/f9-harmonic-comparison.test.mjs
      - run: mkdir -p /tmp/f95-results
      - name: Verify and decode original C5 recordings (temporary only)
        run: |
          PYTHONPATH=research/c3x-physical python - <<'PY'
          from pathlib import Path
          from download_analyze_c5 import download_sources
          from c5_c4_analysis import SOURCES
          import soundfile as sf
          p=Path('/tmp/f95-c5')
          download_sources(p)
          for k, d in SOURCES.items():
              x,rate=sf.read(p/d['file'],dtype='float32',always_2d=True)
              assert rate==48000 and x.shape[1]==2
              x.astype('<f4').tofile(p/(k+'.f32'))
          PY
          for k in v1 v8 v16; do
            node research/stage-concert-grand/f9-long-analysis-cli.mjs "/tmp/f95-c5/$k.f32" "/tmp/f95-results/c5-$k.json" .005 48000 2
          done
      - name: Compare harmonic balance and decay
        run: node research/stage-concert-grand/f9-harmonic-comparison-cli.mjs /tmp/f95-results /tmp/f95-results/f916-comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: F916-reference-numeric-only
          path: /tmp/f95-results/*.json
          if-no-files-found: error
      - if: always()
        run: rm -rf /tmp/f95-c5
