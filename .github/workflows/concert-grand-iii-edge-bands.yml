name: Concert Grand III exact radial band quadrature
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/bem_edge_bands.py','research/stage-concert-grand-iii/test_bem_edge_bands.py','.github/workflows/concert-grand-iii-edge-bands.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - run: python research/stage-concert-grand-iii/test_bem_edge_bands.py
      - run: python research/stage-concert-grand-iii/test_bem_edge_localization.py
      - run: python research/stage-concert-grand-iii/test_bem_edge_strip.py
