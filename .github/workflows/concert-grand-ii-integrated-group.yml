name: Concert Grand II G2.08c integrated contact and polarization
on:
  push:
    branches: [research/stage-concert-grand-ii]
    paths: ['research/stage-concert-grand-ii/g2_integrated_group*.mjs','.github/workflows/concert-grand-ii-integrated-group.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand-ii/g2_group_hammer.test.mjs
      - run: node research/stage-concert-grand-ii/g2_polar_port.test.mjs
      - run: node research/stage-concert-grand-ii/g2_integrated_group.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: G2-integrated-group-numeric
          path: /tmp/g2-integrated/report.json
          if-no-files-found: error
