name: Concert Grand II G2.05b string convergence
on:
  push:
    branches: [research/stage-concert-grand-ii]
    paths: ['research/stage-concert-grand-ii/g2_string_pilot.mjs','research/stage-concert-grand-ii/g2_string_convergence.mjs','.github/workflows/concert-grand-ii-string-convergence.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand-ii/g2_string_pilot.test.mjs
      - run: node research/stage-concert-grand-ii/g2_string_convergence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G2-string-convergence-numeric
          path: /tmp/g2-string-convergence/report.json
          if-no-files-found: error
