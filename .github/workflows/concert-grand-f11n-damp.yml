name: Concert Grand F11n bass selective bass modal damping
on:
  push:
    branches: [research/stage-concert-grand]
    paths:
      - '.github/workflows/concert-grand-f11n-damp.yml'
      - 'research/stage-concert-grand/f11n-bass-damp-trial*.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f11n-bass-damp-trial.test.mjs
  trials:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        midi: [36,43,48]
        variant: [M2,M4]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f11n-bass-damp-trial-demo.mjs /tmp/f11n ${{ matrix.midi }} 127 ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: F11N-bass-midi${{ matrix.midi }}-variant${{ matrix.variant }}-touch127
          path: /tmp/f11n/
          if-no-files-found: error
