name: Concert Grand III regularized passive selection
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/regularized_board_fit.py','research/stage-concert-grand-iii/test_regularized_board_fit.py','.github/workflows/concert-grand-iii-regularized-fit.yml']
  workflow_dispatch:
    inputs:
      dense:
        description: 'Use approved dense reference from run 45730538297'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - run: python research/stage-concert-grand-iii/test_regularized_board_fit.py
  proof:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        angle: ['30','55']
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: |
          if [ "${{ github.event_name }}" = push ] || [ "${{ inputs.dense }}" = true ]; then
            test "$(gh run view 45730538297 --json conclusion --jq .conclusion)" = success
            gh run download 45730538297 -n G3-dense-reference-${{ matrix.angle }} -D /tmp/g3-input
            mode=dense
          else
            gh run download 45726103993 -n G3-graded-combined-${{ matrix.angle }} -D /tmp/g3-input
            mode=fine
          fi
          python research/stage-concert-grand-iii/regularized_board_fit.py --scale /tmp/g3-scale/scale_geometry.json --"$mode" /tmp/g3-input --angle ${{ matrix.angle }} --out /tmp/g3-fit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-regularized-fit-${{ matrix.angle }}
          path: /tmp/g3-fit/
          if-no-files-found: warn
