name: Concert Grand F11u continuous musical phrase
on:
  push:
    branches: [research/stage-concert-grand]
    paths: ['research/stage-concert-grand/f11u-*.mjs','.github/workflows/concert-grand-f11u-phrase.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f11u-phrase-demo.mjs /tmp/smoke K750 smoke
  phrase:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        variant: [K750,K1000]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --max-old-space-size=6144 research/stage-concert-grand/f11u-phrase-demo.mjs /tmp/f11u ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: F11U-original-phrase-${{ matrix.variant }}
          path: /tmp/f11u/
          if-no-files-found: error
