name: Concert Grand III energy equilibrated structural response
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/structural_response*.py','research/stage-concert-grand-iii/test_structural_response.py','.github/workflows/concert-grand-iii-conditioning.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        case: [rim,structure]
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/test_structural_response.py
      - run: python research/stage-concert-grand-iii/structural_response_diagnostic.py --scale /tmp/g3-scale/scale_geometry.json --case ${{ matrix.case }} --out /tmp/g3-condition
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-condition-${{ matrix.case }}
          path: /tmp/g3-condition/
          if-no-files-found: warn
