name: Concert Grand III cabinet and lid geometry
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/cabinet_geometry*','research/stage-concert-grand-iii/test_cabinet_geometry.py','.github/workflows/concert-grand-iii-cabinet.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/test_cabinet_geometry.py
      - run: python research/stage-concert-grand-iii/cabinet_geometry.py --scale /tmp/g3-scale/scale_geometry.json --out /tmp/g3-cabinet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-cabinet-geometry
          path: /tmp/g3-cabinet/
          if-no-files-found: warn
