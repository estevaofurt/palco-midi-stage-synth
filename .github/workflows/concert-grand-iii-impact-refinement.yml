name: Concert Grand III C8 refinement and modal target preparation
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/impact_refinement.py','research/stage-concert-grand-iii/modal_target.py','.github/workflows/concert-grand-iii-impact-refinement.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/test_modal_target.py
      - run: python research/stage-concert-grand-iii/impact_refinement.py --scale /tmp/g3-scale/scale_geometry.json --out /tmp/g3-c8
      - uses: actions/upload-artifact@v4
        with:
          name: G3-C8-refinement
          path: /tmp/g3-c8/
          if-no-files-found: error
