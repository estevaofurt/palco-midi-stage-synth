name: Concert Grand III fixed snapshot spatial transfer
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/fixed_snapshot_transfer.py','research/stage-concert-grand-iii/test_fixed_snapshot_transfer.py','.github/workflows/concert-grand-iii-fixed-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - run: python research/stage-concert-grand-iii/test_fixed_snapshot_transfer.py
  proof:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        angle: ['30','55']
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - run: |
          for r in 45717196561 45723509912 45725159589; do
            test "$(gh run view "$r" --json conclusion --jq .conclusion)" = success
          done
          # Wait only on the corresponding angle, not the entire matrix run.
          for r in 45729028788 45726103993; do
            for attempt in $(seq 1 110); do
              status=$(gh run view "$r" --json jobs --jq '.jobs[] | select(.name=="proof (${{ matrix.angle }})") | .status')
              if [ "$status" = completed ]; then break; fi
              sleep 60
            done
            test "$(gh run view "$r" --json jobs --jq '.jobs[] | select(.name=="proof (${{ matrix.angle }})") | .conclusion')" = success
          done
          gh run download 45717196561 -n G3-high-modal-${{ matrix.angle }} -D /tmp/g3-high
          gh run download 45723509912 -n G3-consolidated-exterior-${{ matrix.angle }} -D /tmp/g3-ext
          gh run download 45725159589 -n G3-graded-cavity-${{ matrix.angle }} -D /tmp/g3-graded
          gh run download 45726103993 -n G3-graded-combined-${{ matrix.angle }} -D /tmp/g3-fine
          gh run download 45729028788 -n G3-snapshot-reduction-${{ matrix.angle }} -D /tmp/g3-snapshot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          name: G3-scale-geometry-02
          run-id: 45643063220
          github-token: ${{ github.token }}
          path: /tmp/g3-scale
      - run: python research/stage-concert-grand-iii/fixed_snapshot_transfer.py --scale /tmp/g3-scale/scale_geometry.json --archive /tmp/g3-high --consolidated /tmp/g3-ext --graded /tmp/g3-graded --fine /tmp/g3-fine --snapshot /tmp/g3-snapshot --angle ${{ matrix.angle }} --out /tmp/g3-fixed-rom
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-fixed-snapshot-${{ matrix.angle }}
          path: /tmp/g3-fixed-rom/
          if-no-files-found: warn
