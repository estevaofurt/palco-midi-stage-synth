name: Concert Grand III dry non-diagonal damping midpoint
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/dry_damping_midpoint.py','research/stage-concert-grand-iii/test_dry_damping_midpoint.py','.github/workflows/concert-grand-iii-dry-damping.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3 numba==0.61.2
      - run: python research/stage-concert-grand-iii/test_dry_damping_midpoint.py
      - uses: actions/download-artifact@v4
        with:
          name: G3-dry-structural-modal
          run-id: 45735499371
          github-token: ${{ github.token }}
          path: /tmp/g3-dry
      - run: python research/stage-concert-grand-iii/dry_damping_midpoint.py --source /tmp/g3-dry --out /tmp/g3-damping
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G3-dry-damping
          path: /tmp/g3-damping/
          if-no-files-found: warn
