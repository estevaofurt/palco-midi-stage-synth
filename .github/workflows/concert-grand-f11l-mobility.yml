name: Concert Grand F11L coupled mechanical mobility
on:
  push:
    branches: [research/stage-concert-grand]
    paths:
      - '.github/workflows/concert-grand-f11l-mobility.yml'
      - 'research/stage-concert-grand/f11l-coupled-mobility*.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/stage-concert-grand/f11l-coupled-mobility.test.mjs
      - run: node research/stage-concert-grand/f11l-coupled-mobility-review.mjs /tmp/f11l
      - uses: actions/upload-artifact@v4
        with:
          name: F11L-coupled-mechanical-mobility
          path: /tmp/f11l/
          if-no-files-found: error
