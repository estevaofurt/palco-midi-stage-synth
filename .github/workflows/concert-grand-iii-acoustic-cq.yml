name: Concert Grand III convolution quadrature pilot
on:
  push:
    branches: [research/stage-concert-grand-iii]
    paths: ['research/stage-concert-grand-iii/acoustic_cq_pilot.py','research/stage-concert-grand-iii/test_acoustic_cq_pilot.py','.github/workflows/concert-grand-iii-acoustic-cq.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3 numba==0.61.2
      - run: python research/stage-concert-grand-iii/test_acoustic_cq_pilot.py
      - run: python research/stage-concert-grand-iii/acoustic_cq_pilot.py --out /tmp/g3-cq
      - uses: actions/upload-artifact@v4
        with:
          name: G3-acoustic-cq-pilot
          path: /tmp/g3-cq/
