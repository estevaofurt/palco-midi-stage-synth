<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="#171719" name="theme-color"/><title>Palco MIDI · Stage Synth</title><link href="./panel.css" rel="stylesheet"/></head><body><main class="console">
<header class="rail">
<h1><span aria-hidden="true" class="brand-symbol"><i></i><i></i><i></i><i></i></span>Palco<span class="brand-sub">MIDI</span></h1>
<div class="connections">
<button class="hard-button" id="midi" type="button"><i aria-hidden="true" class="midi-led"></i>Conectar MIDI</button>
<button class="hard-button power" id="power" type="button"><span aria-hidden="true" class="power-icon"></span><span>Ativar áudio</span></button>
</div>
</header>
<div class="dashboard">
<div class="display-bezel">
<div class="display">
<label class="legend" for="scene">Cena</label>
<div class="scene-select"><select aria-label="Cena" id="scene"></select><i aria-hidden="true"></i></div>
<div class="display-bottom"><span id="layer-count">2 motores ligados</span><span class="display-div"></span><span id="bank">Cauda estéreo · 3 camadas de toque</span></div>
</div>
</div>
<div class="out-section">
<div class="out-head"><span class="panel-label">Saída de áudio</span><output id="peak">−∞ dB</output></div>
<div aria-hidden="true" class="levelmeter" id="meter"></div>
<div aria-hidden="true" class="ruler"><span>−48</span><span>−24</span><span>−12</span><span>−6</span><span>0 dB</span></div>
</div>
</div>
<p hidden="" id="status" role="status"></p>
<div class="section-heading"><h2>Motores sonoros</h2><span class="engraved-line"></span></div>
<div aria-label="Controles dos motores" class="modules" id="modules"></div>
<div id="editors"></div>
<section aria-label="Teclado de toque" class="keyboard-panel">
<div class="keytools">
<h2>Teclado</h2>
<div class="octave"><span class="oct-label">Oitava</span><button aria-label="Descer oitava" id="oct-down" type="button">−</button><output id="octave">4</output><button aria-label="Subir oitava" id="oct-up" type="button">+</button></div>
<button aria-pressed="false" class="pedal-button" id="pedal" type="button"><i aria-hidden="true" class="lamp"></i>Sustain</button>
<button class="cut-button" id="panic" type="button"><i aria-hidden="true" class="square"></i>Cortar som</button>
</div>
<div class="keybed"><div aria-label="Notas do teclado" id="keys" style="--whites: 15;"></div></div>
</section>
<footer><span id="midi-status" role="status">Teclado na tela disponível.</span><a href="./creditos.html" rel="noopener" target="_blank">Créditos de áudio</a></footer>
</main><script src="./app.js" type="module"></script></body></html>
